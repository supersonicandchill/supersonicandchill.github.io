<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#F5F4EF">
<link rel="icon" href="data:,">
<title>Know Your Rig</title>
<style>
:root{
  --bg:#F5F4EF; --navy:#2B3A52; --amber:#D4860B; --teal:#3D7A6F; --red:#C0392B;
  --engine:#C8102E; --ink:#1A1A2E; --muted:#4A4F5E; --line:#D3D0C4; --card:#FBFAF7;
}
html{color-scheme:light only;background:#F5F4EF !important;}
*{box-sizing:border-box;}
body{margin:0;background:#F5F4EF !important;color:var(--ink);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;}
#app{max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 32px);}
button{font:inherit;color:inherit;}
@media (min-width:700px){body{font-size:21px;} #app{max-width:900px;padding-left:32px;padding-right:32px;} h1.title{font-size:32px;} h2{font-size:22px;} .q{font-size:26px;} .btn{min-height:58px;font-size:20px;border-radius:12px;} .btn.small{min-height:48px;} .opt{min-height:64px;font-size:21px;} .pin{width:38px;height:38px;} .num{width:38px;height:38px;font-size:18px;} .meta{font-size:17px;} .found .where{font-size:34px;} .findbox{min-height:62px;font-size:22px;}}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top) + 5px);background:linear-gradient(to bottom,transparent env(safe-area-inset-top),var(--engine) env(safe-area-inset-top));pointer-events:none;z-index:5;}
header.top{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--engine);}
h1.title{font-size:22px;line-height:1.2;font-weight:700;color:var(--navy);margin:0;flex:1;overflow-wrap:anywhere;}
h2{color:var(--navy);margin:0 0 8px;font-size:18px;overflow-wrap:anywhere;}
p{margin:6px 0;}
.sub{color:var(--muted);margin:0 0 12px;}
.sect{border-left:4px solid var(--teal);padding-left:10px;margin:22px 0 8px;font-weight:700;color:var(--navy);}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:10px;
  border:1.5px solid var(--navy);background:var(--navy);color:#F5F4EF;font-weight:600;cursor:pointer;text-align:center;}
.btn.ghost{background:transparent;color:var(--navy);}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#FFFFFF;}
.btn.danger{background:var(--red);border-color:var(--red);color:#FFFFFF;}
.btn.small{min-height:40px;padding:0 12px;}
.btn.block{display:flex;width:100%;margin:10px 0;}
.btn:disabled{opacity:.5;cursor:default;}
.card{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;text-align:left;}
button.card{cursor:pointer;}
.row{display:flex;align-items:center;gap:12px;}
.row.tight{padding:10px 14px;}
.grow{flex:1;min-width:0;}
.name{font-weight:600;overflow-wrap:anywhere;}
.meta{color:var(--muted);font-size:14px;}
.chev{color:var(--navy);font-size:24px;line-height:1;}
.badge{background:var(--amber);color:var(--ink);font-weight:700;font-size:14px;border-radius:999px;padding:3px 10px;white-space:nowrap;}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;}
.thumb.empty{background:#E8E5DA;}
.warn{border:1.5px solid var(--red);color:var(--red);background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600;}
.banner{background:var(--navy);color:#F5F4EF;border-radius:10px;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;}
.banner span{flex:1;}
.banner .btn{background:transparent;border-color:#F5F4EF;color:#F5F4EF;min-height:38px;padding:0 12px;}
.num{width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--ink);font-weight:700;display:grid;place-items:center;flex:none;font-size:14px;border:1.5px solid var(--ink);}
.num.nopin{background:transparent;color:var(--muted);border-color:var(--line);}
.photo{position:relative;line-height:0;border-radius:10px;overflow:hidden;border:2px solid var(--engine);margin:10px 0;touch-action:manipulation;user-select:none;-webkit-user-select:none;}
.photo img{width:100%;height:auto;display:block;-webkit-user-drag:none;pointer-events:none;}
.photo.tapping{outline:3px solid var(--amber);cursor:crosshair;}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--amber);color:var(--ink);
  border:2px solid #FBFAF7;box-shadow:0 0 0 1.5px var(--ink);display:grid;place-items:center;font:700 13px/1 system-ui,sans-serif;padding:0;}
.pin.sel{background:var(--navy);color:#F5F4EF;}
.pin.user{background:#FFFFFF;color:var(--ink);}
.pin.ring::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--amber);}
.findbox{width:100%;min-height:52px;font-size:18px;padding:0 14px;border-radius:12px;border:2px solid var(--navy);background:#FFFFFF;color:var(--ink);margin:6px 0 10px;-webkit-appearance:none;appearance:none;}
.letter{margin:14px 0 2px;padding-left:4px;font-weight:700;color:var(--teal);}
.found{background:var(--navy);color:#F5F4EF;border-radius:14px;padding:14px 16px;margin:8px 0;}
.found .lbl{font-size:14px;opacity:.9;}
.found .where{font-size:26px;line-height:1.2;font-weight:700;overflow-wrap:anywhere;}
.sheet textarea{width:100%;min-height:110px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--navy);background:#FFFFFF;color:var(--ink);margin:8px 0;resize:vertical;}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;}
.notecard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:12px 14px;margin:10px 0;}
.notecard .lbl{font-weight:700;color:var(--navy);margin-bottom:4px;}
.notecard .txt{white-space:pre-wrap;overflow-wrap:anywhere;}
.dropzone{border:2px dashed var(--navy);border-radius:12px;padding:26px 12px;text-align:center;color:var(--navy);margin:10px 0;}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:12px 14px;margin:8px 0;border-radius:12px;
  border:1.5px solid var(--navy);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;overflow-wrap:anywhere;}
.opt.unsure{border-style:dashed;color:var(--muted);font-weight:500;}
.opt:disabled{opacity:1;cursor:default;}
.opt.right{background:var(--teal);border-color:var(--teal);color:#FFFFFF;}
.opt.wrong{background:var(--red);border-color:var(--red);color:#FFFFFF;}
.fb{border-left:5px solid var(--teal);}
.fb.bad{border-left-color:var(--red);}
.fb strong.ok{color:var(--teal);} .fb strong.bad{color:var(--red);}
.prog{height:8px;border-radius:99px;background:#E1DED2;overflow:hidden;margin:6px 0 14px;}
.prog>i{display:block;height:100%;background:var(--teal);}
.q{font-size:20px;line-height:1.25;color:var(--navy);font-weight:700;margin:6px 0 10px;overflow-wrap:anywhere;}
.overlay{position:fixed;inset:0;background:rgba(26,26,46,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:#F5F4EF;width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:88vh;overflow:auto;}
.sheet input[type=text]{width:100%;min-height:48px;font-size:16px;padding:0 12px;border-radius:10px;border:1.5px solid var(--navy);background:#FFFFFF;color:var(--ink);margin:8px 0;}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--navy);color:#F5F4EF;
  padding:10px 16px;border-radius:10px;z-index:80;max-width:90%;text-align:center;}
.two{display:flex;gap:10px;} .two>*{flex:1;}
.empty{color:var(--muted);}

/* ---- polish ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;-webkit-overflow-scrolling:touch;}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--navy);background:var(--card);color:var(--navy);font-weight:600;cursor:pointer;}
.chip.on{background:var(--navy);color:#F5F4EF;}
.rigname{margin:0 0 6px;font-weight:600;color:var(--navy);}
h1.title,.found .where{font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.2px;}
h1.title{font-size:27px;font-weight:700;}
.card{box-shadow:0 1px 0 rgba(26,26,46,.05),0 3px 10px rgba(26,26,46,.05);transition:background-color .12s,transform .12s;}
button.card:active{background:#F0EEE6;transform:scale(.992);}
.btn{transition:transform .12s,filter .12s;}
.btn:active:not(:disabled){transform:scale(.985);filter:brightness(1.12);}
.opt{transition:transform .12s;} .opt:active:not(:disabled){transform:scale(.99);}
.sect{font-size:17px;letter-spacing:.1px;margin-top:26px;}
.found{border-bottom:4px solid var(--engine);box-shadow:0 6px 16px rgba(26,26,46,.12);}
.found .where{font-size:28px;}
.photo{box-shadow:0 4px 14px rgba(26,26,46,.14);}
.pin{box-shadow:0 0 0 2px #FFFFFF,0 2px 6px rgba(0,0,0,.35);}
.prog>i{background:linear-gradient(90deg,var(--teal),var(--teal));}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;}
.brand img{width:44px;height:44px;border-radius:10px;flex:none;box-shadow:0 2px 6px rgba(26,26,46,.25);}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--amber);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
@media (min-width:700px){h1.title{font-size:34px;} .found .where{font-size:38px;} .brand img{width:56px;height:56px;border-radius:13px;}}

/* ui pass 2 */
header.top.inner{display:block;border-bottom:2px solid var(--engine);padding-bottom:10px;margin-bottom:12px;}
.backlink{display:inline-flex;align-items:center;min-height:40px;margin:0 0 0 -4px;padding:0 10px 0 4px;background:none;border:0;color:var(--teal);font:inherit;font-weight:700;cursor:pointer;}
header.top.inner h1.title{font-size:30px;line-height:1.1;margin-top:0;}
.mono{flex:0 0 auto;width:52px;height:52px;border-radius:10px;background:var(--navy);color:#F5F4EF;display:flex;align-items:center;justify-content:center;font-family:"Avenir Next Condensed","Arial Narrow","Roboto Condensed",-apple-system,Helvetica,Arial,sans-serif;font-weight:800;font-size:23px;letter-spacing:.5px;border-bottom:4px solid var(--engine);margin-right:12px;}
.rigrow{align-items:center;padding:12px 14px;}
.pair{display:flex;gap:10px;margin:14px 0 6px;}
.pair .btn{flex:1;min-width:0;padding:0 8px;font-size:15px;}
.btn.primary{min-height:56px;font-size:18px;box-shadow:0 2px 0 rgba(26,26,46,.25);}
.btn.tealline{background:transparent;color:var(--teal);border-color:var(--teal);}
.btn.dashed{background:transparent;color:var(--navy);border:1.5px dashed #9AA3B2;}
.center{text-align:center;}.beta{border:1.5px solid var(--teal,#3D7A6F);}.beta p{margin:6px 0 10px;}.nudge p{margin:6px 0 10px;}
.textlink{display:block;margin:10px auto 4px;padding:10px 16px;background:none;border:0;color:var(--muted);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
@media (min-width:700px){.mono{width:64px;height:64px;font-size:28px;} header.top.inner h1.title{font-size:38px;} .btn.primary{min-height:64px;}}

.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.editbtn{min-height:40px;min-width:76px;padding:0 18px;background:transparent;color:var(--navy);}
.editbtn.on{background:var(--amber);border-color:var(--amber);color:var(--ink);}
.editbar{background:#FBEBD0;border:1.5px solid var(--amber);color:var(--ink);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-weight:600;font-size:15px;}
.hint{margin:8px 2px 6px;}
.notetext{white-space:pre-wrap;overflow-wrap:anywhere;font-size:18px;line-height:1.4;margin:6px 0 14px;}
.pin.ghost{background:#FFFFFF;color:var(--navy);border:2px dashed var(--navy);pointer-events:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ *
 *  Know Your Rig — single file, no dependencies.
 *  Storage sits behind Store{} so the Capacitor build can swap the
 *  IndexedDB calls for @capacitor/filesystem + @capacitor/preferences.
 * ------------------------------------------------------------------ */

var INTERVALS=[0,1,3,7,14,30,60];      // days between reviews, by box
var TAP_RADIUS=0.16;                    // fraction of the photo's short side
var MAX_NAME=60, MAX_NOTE=500, MAX_COMPS=100, MAX_TOOLS=500, MAX_PHOTO_CHARS=8*1024*1024;
var clock=function(){return new Date();};

var state={rigs:[],comps:[],tools:[],view:'home',rigId:null,compId:null,stack:[],quiz:null,placing:null,toolId:null,findQ:'',edit:false};
var photoUrl=new Map();                 // photoId -> object URL
var db=null, persistent=false;

/* ---------- tiny DOM helper (no innerHTML, so names can't inject markup) ---------- */
function h(tag,attrs){
  var e=document.createElement(tag), kids=Array.prototype.slice.call(arguments,2);
  if(attrs){ Object.keys(attrs).forEach(function(k){
    var v=attrs[k]; if(v==null||v===false) return;
    if(k==='class') e.className=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(k==='disabled'||k==='value'||k==='src'||k==='type'||k==='placeholder'||k==='maxLength'||k==='autocomplete') e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  });}
  (function add(list){ list.forEach(function(c){
    if(c==null||c===false) return;
    if(Array.isArray(c)) return add(c);
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  });})(kids);
  return e;
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9);}
function pl(n,w){return n+' '+w+(n===1?'':'s');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function lc(s){return String(s).trim().toLowerCase();}

var toastTimer=null;
function toast(msg){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=h('div',{class:'toast',role:'status'},msg); document.body.append(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.remove();},3200);
}

/* ---------- storage ---------- */
var STORES=['rigs','comps','tools','photos'];
function openDB(){return new Promise(function(res,rej){
  if(!window.indexedDB) return rej(new Error('no indexedDB'));
  var r; try{ r=indexedDB.open('knowyourrig',1); }catch(e){ return rej(e); }
  r.onupgradeneeded=function(){var d=r.result;STORES.forEach(function(s){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; r.onblocked=function(){rej(new Error('blocked'));};
});}
function tx(store,mode,fn){return new Promise(function(res,rej){
  var t=db.transaction(store,mode), s=t.objectStore(store), req;
  try{req=fn(s);}catch(e){return rej(e);}
  t.oncomplete=function(){res(req&&req.result);}; t.onerror=function(){rej(t.error);}; t.onabort=function(){rej(t.error||new Error('aborted'));};
});}
var Store={
  init:function(){return openDB().then(function(d){db=d;persistent=true;}).catch(function(){persistent=false;});},
  all:function(s){return persistent?tx(s,'readonly',function(st){return st.getAll();}).then(function(r){return r||[];}):Promise.resolve([]);},
  put:function(s,o){return persistent?tx(s,'readwrite',function(st){return st.put(o);}):Promise.resolve();},
  del:function(s,id){return persistent?tx(s,'readwrite',function(st){return st.delete(id);}):Promise.resolve();}
};
function save(store,obj){return Store.put(store,obj).then(function(){return true;}).catch(function(e){console.error(e);toast('Could not save. Storage may be full.');return false;});}
function drop(store,id){return Store.del(store,id).catch(function(e){console.error(e);});}

/* ---------- model helpers ---------- */
function rigById(id){return state.rigs.find(function(r){return r.id===id;});}
function compById(id){return state.comps.find(function(c){return c.id===id;});}
function toolById(id){return state.tools.find(function(t){return t.id===id;});}
function compTools(cid){return state.tools.filter(function(t){return t.compId===cid;});}
function newSrs(){return {box:0,due:null,seen:0,lapses:0,last:null,lastMode:null};}
function rigStats(rid){
  var tools=state.tools.filter(function(t){return t.rigId===rid;});
  return {comps:state.comps.filter(function(c){return c.rigId===rid;}).length,tools:tools.length,
          due:tools.filter(isDue).length,fresh:tools.filter(isNew).length};
}

/* ---------- spaced repetition ---------- */
function dayNum(d){d=d||clock();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000);}
function isNew(t){return !t.srs.seen;}
function isDue(t){return t.srs.seen>0&&t.srs.due!=null&&t.srs.due<=dayNum();}
function grade(t,correct,practice){
  var s=t.srs, today=dayNum(); s.seen++; s.last=today;
  if(correct){
    if(practice&&s.due!=null&&s.due>today) return;         // early practice never inflates the interval
    s.box=Math.min(s.box+1,INTERVALS.length-1); s.due=today+INTERVALS[s.box];
  }else{ s.box=0; s.lapses++; s.due=today; }
}

/* ---------- quiz engine ---------- */
function compsWithName(rigId,name){
  var ids=new Set(); state.tools.forEach(function(t){if(t.rigId===rigId&&lc(t.name)===lc(name))ids.add(t.compId);}); return ids;
}
function distractorNames(t){
  var seen=new Set([lc(t.name)]), out=[];
  state.tools.filter(function(o){return o.rigId===t.rigId&&o.id!==t.id;})
    .sort(function(a,b){return (b.compId===t.compId)-(a.compId===t.compId);})
    .forEach(function(o){var k=lc(o.name);if(seen.has(k))return;seen.add(k);out.push(o.name);});
  return out;
}
function modesFor(t){
  var comp=compById(t.compId), m=[];
  if(!comp) return ['recall'];
  var have=compsWithName(t.rigId,t.name);
  var others=state.comps.filter(function(c){return c.rigId===t.rigId&&!have.has(c.id);});
  if(others.length>=1) m.push('where');
  if(t.x!=null&&comp.photoId&&photoUrl.has(comp.photoId)){ m.push('tap'); if(distractorNames(t).length>=2) m.push('what'); }
  return m.length?m:['recall'];
}
function pickMode(t,avoid){
  var ms=modesFor(t), a=avoid||t.srs.lastMode, pool=ms.filter(function(x){return x!==a;});
  var use=pool.length?pool:ms; return use[Math.floor(Math.random()*use.length)];
}
function buildSession(rigId,opts){
  opts=opts||{}; var tools=state.tools.filter(function(t){return t.rigId===rigId&&compById(t.compId);}), q;
  if(opts.practice){
    var seen=tools.filter(function(t){return t.srs.seen>0;});
    q=shuffle(seen.length?seen:tools).slice(0,10);
  }else{
    var due=tools.filter(isDue).sort(function(a,b){return a.srs.due-b.srs.due;});
    var fresh=shuffle(tools.filter(isNew)).slice(0,opts.limitNew==null?5:opts.limitNew);
    q=due.concat(fresh).slice(0,opts.max||20);
  }
  return q.map(function(t){return {toolId:t.id,mode:pickMode(t),reinforce:false};});
}
function judgeTap(x,y,px,py,w,hgt){return Math.hypot((x-px)*w,(y-py)*hgt)<=TAP_RADIUS*Math.min(w,hgt);}

/* ---------- navigation ---------- */
function go(view,ids,quiz){
  state.stack.push({view:state.view,rigId:state.rigId,compId:state.compId});
  state.view=view; Object.assign(state,ids||{}); state.quiz=quiz||null; state.placing=null;
  if(view!=='rig'&&view!=='comp') state.edit=false;
  render(); window.scrollTo(0,0);
}
function back(){
  var p=state.stack.pop();
  if(p){state.view=p.view;state.rigId=p.rigId;state.compId=p.compId;} else {state.view='home';}
  state.quiz=null; state.placing=null; if(state.view!=='rig'&&state.view!=='comp') state.edit=false; render(); window.scrollTo(0,0);
}

/* ---------- sheets ---------- */
function sheet(title,build,onClose){
  var overlay=h('div',{class:'overlay',role:'dialog','aria-modal':'true','aria-label':title}), closed=false;
  var close=function(){overlay.remove();document.removeEventListener('keydown',onKey);if(!closed){closed=true;if(onClose)onClose();}};
  var onKey=function(e){if(e.key==='Escape')close();};
  var box=h('div',{class:'sheet'},h('h2',null,title)); build(box,close); overlay.append(box);
  overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
  document.addEventListener('keydown',onKey); document.body.append(overlay);
  var inp=box.querySelector('input'); if(inp){inp.focus();inp.select();}
  return close;
}
function nameSheet(title,initial,okLabel,onOk,extra,onClose){
  sheet(title,function(box,close){
    var inp=h('input',{type:'text',value:initial||'',maxLength:MAX_NAME,autocomplete:'off','aria-label':title});
    var go_=function(){var v=inp.value.trim(); if(!v){toast('Enter a name.');return;} close(); onOk(v);};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')go_();});
    box.append(inp);
    if(extra) box.append(extra(inp,close));
    box.append(h('div',{class:'two'},h('button',{class:'btn ghost',onclick:close},'Cancel'),h('button',{class:'btn',onclick:go_},okLabel)));
  },onClose);
}
function confirmSheet(msg,label,onOk,cls){
  sheet('Are you sure?',function(box,close){
    box.append(h('p',null,msg),h('div',{class:'two'},h('button',{class:'btn ghost',onclick:close},'Cancel'),
      h('button',{class:'btn '+(cls||'danger'),onclick:function(){close();onOk();}},label)));
  });
}

/* ---------- photos ---------- */
function compress(file,max,q){
  var url=URL.createObjectURL(file);
  return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error('Could not read that image.'));};i.src=url;})
  .then(function(img){
    var s=Math.min(1,(max||1600)/Math.max(img.naturalWidth,img.naturalHeight));
    var w=Math.max(1,Math.round(img.naturalWidth*s)), hh=Math.max(1,Math.round(img.naturalHeight*s));
    var c=document.createElement('canvas'); c.width=w; c.height=hh; c.getContext('2d').drawImage(img,0,0,w,hh);
    return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('Could not process that image.'));},'image/jpeg',q||0.82);});
  }).then(function(b){URL.revokeObjectURL(url);return b;},function(e){URL.revokeObjectURL(url);throw e;});
}
var lastPicker=null;
function pickFile(accept,cb){
  if(lastPicker){lastPicker.remove();lastPicker=null;}
  var i=document.createElement('input'); i.type='file'; i.accept=accept; i.style.display='none';
  i.addEventListener('change',function(){var f=i.files&&i.files[0]; i.remove(); if(lastPicker===i)lastPicker=null; if(f) cb(f);});
  lastPicker=i; document.body.append(i); i.click();
}
function setCompPhoto(comp,blob){
  var id=uid(), old=comp.photoId;
  return Store.put('photos',{id:id,blob:blob}).then(function(){
    photoUrl.set(id,URL.createObjectURL(blob)); comp.photoId=id; return save('comps',comp);
  }).then(function(){
    if(old){URL.revokeObjectURL(photoUrl.get(old));photoUrl.delete(old);return drop('photos',old);}
  }).catch(function(e){console.error(e);toast('Could not save the photo. Storage may be full.');});
}
function choosePhoto(comp){
  pickFile('image/*',function(f){
    compress(f).then(function(b){return setCompPhoto(comp,b);}).then(render).catch(function(e){toast(e.message||'Photo failed.');});
  });
}

/* ---------- photo view with pins ---------- */
function photoView(comp,o){
  o=o||{}; var url=comp&&comp.photoId&&photoUrl.get(comp.photoId);
  if(!url) return h('div',{class:'dropzone'},'No photo for this compartment yet.');
  var box=h('div',{class:'photo'+(o.tapping?' tapping':'')}, h('img',{src:url,alt:comp.name+' photo',draggable:false}));
  (o.pins||[]).forEach(function(p){
    var el=h('button',{class:'pin'+(p.sel?' sel':'')+(p.ring?' ring':'')+(p.user?' user':''),
      style:'left:'+(p.x*100)+'%;top:'+(p.y*100)+'%;','aria-label':p.label||('Pin '+p.text)},p.text);
    if(p.onclick) el.addEventListener('click',function(e){e.stopPropagation();p.onclick();}); else el.style.pointerEvents='none';
    box.append(el);
  });
  if(o.onTap) box.addEventListener('click',function(e){
    var r=box.getBoundingClientRect(); if(!r.width||!r.height) return;
    o.onTap(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)),r.width,r.height);
  });
  return box;
}

/* ---------- quiz ---------- */
function startQuiz(rigId,practice){
  var items=buildSession(rigId,{practice:practice});
  if(!items.length){toast('Nothing to quiz yet.');return;}
  go('quiz',{rigId:rigId},{rigId:rigId,items:items,i:0,answered:null,revealed:false,results:[],practice:practice});
}
function answer(correct,extra){
  var q=state.quiz; if(!q||q.answered) return;
  var it=q.items[q.i], t=toolById(it.toolId); if(!t) return;
  q.answered=Object.assign({correct:correct},extra||{});
  if(!it.reinforce){
    grade(t,correct,q.practice); t.srs.lastMode=it.mode; save('tools',t); q.results.push({toolId:t.id,correct:correct});
    if(!correct) q.items.splice(Math.min(q.i+3,q.items.length),0,{toolId:t.id,mode:pickMode(t,it.mode),reinforce:true});
  }
  render();
}
function next(){var q=state.quiz;q.i++;q.answered=null;q.revealed=false;render();window.scrollTo(0,0);}

function feedback(t,comp,ans,extraPins){
  var pins=t.x!=null?[{x:t.x,y:t.y,text:'✓',label:t.name,ring:true}]:[];
  if(extraPins) pins=pins.concat(extraPins);
  return h('div',{class:'card fb'+(ans.correct?'':' bad')},
    h('strong',{class:ans.correct?'ok':'bad'},ans.correct?'Correct.':'Missed.'),

    }

    else if(!a) out.push(h('div',{class:'card'},h('strong',null,comp.name),photoView(comp,{pins:t.x!=null?[{x:t.x,y:t.y,text:'✓',ring:true}]:[]})),
      h('div',{class:'two'},h('button',{class:'btn danger',onclick:function(){answer(false);}},'Missed it'),h('button',{class:'btn teal',onclick:function(){answer(true);}},'Knew it')));

function safeFile(n){return (n.replace(/[^A-Za-z0-9 _-]+/g,'').trim().replace(/\s+/g,'-')||'rig')+'.rigdeck';}

/* Build the JSON object for one rig. Share copies bump the revision; backups keep it. */
function serializeRig(rig,forBackup){
  var comps=state.comps.filter(function(c){return c.rigId===rig.id;});
  // stable ids let a later, updated copy of this deck find the same compartments and tools
  var dirty=[];
  if(!rig.deckId) rig.deckId=uid()+uid();
  if(forBackup){ if(!rig.deckRev) rig.deckRev=Date.now(); } else rig.deckRev=Date.now();
  dirty.push(['rigs',rig]);
  comps.forEach(function(c){
    if(!c.sid){c.sid=uid();dirty.push(['comps',c]);}
    compTools(c.id).forEach(function(t){if(!t.sid){t.sid=uid();dirty.push(['tools',t]);}});
  });
  dirty.forEach(function(d){save(d[0],d[1]);});
  // photos are read straight from their object URLs so this also works when storage is unavailable
  return Promise.all(comps.map(function(c){
    var u=c.photoId&&photoUrl.get(c.photoId); if(!u) return {c:c,photo:null};
    return fetch(u).then(function(r){return r.blob();}).then(blobToDataUrl).then(function(d){return {c:c,photo:d};});
  })).then(function(rows){
    var deck={app:'knowyourrig',v:1,id:rig.deckId,rev:rig.deckRev,name:rig.name,set:(rig.fromShare?rig.setName:getSetName())||undefined,
      comps:rows.map(function(r,i){return {k:i,sid:r.c.sid,name:r.c.name,photo:r.photo};}),tools:[]};
    if(forBackup) deck.fromShare=rig.fromShare?true:undefined;
    rows.forEach(function(r,i){compTools(r.c.id).forEach(function(t){
      var o={k:i,sid:t.sid,name:t.name,x:t.x,y:t.y,note:t.note||undefined};
      if(forBackup) o.srs=t.srs;

}
/* Hand a file to the OS: the iOS share sheet in the app, the Web Share sheet, or a plain download.
   Resolves true when the file was handed off, false when the person cancelled. */
function deliverFile(file,title,dialog){
  var cap=window.Capacitor, P=cap&&cap.Plugins;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&P&&P.Filesystem&&P.Share){
    // inside the iOS app: write the file to the cache folder, then hand it to the share sheet
    return blobToDataUrl(file).then(function(u){
      return P.Filesystem.writeFile({path:file.name,data:u.split(',')[1],directory:'CACHE'});
    }).then(function(r){
      return P.Share.share({title:title,url:r.uri,dialogTitle:dialog});
    }).then(function(){return true;},function(e){if(e&&/cancel/i.test(String(e.message||e)))return false;throw e;});
  }
  var download=function(){
    var a=h('a',{href:URL.createObjectURL(file),download:file.name}); document.body.append(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500); toast('Saved '+file.name);
    return true;
  };
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    // Safari refuses to share if too much time passed since the tap (NotAllowedError); any failure other than cancel falls back to a download
    return navigator.share({files:[file],title:title}).then(function(){return true;},function(e){
      if(e&&e.name==='AbortError') return false;
      console.error('share failed, downloading instead',e); return download();
    });
  }

}
function isNative(){var c=window.Capacitor; return !!(c&&c.isNativePlatform&&c.isNativePlatform());}
function exportDeck(rig){

    var file=new File([JSON.stringify(deck)],safeFile(rig.name),{type:'application/json'});

/* ---------- back up everything to one file ---------- */
var MAX_RIGS=50;
function getLastBackup(){var v=0; try{v=+localStorage.getItem('kyr.lastBackup')||0;}catch(e){} return v>0?v:0;}
function setLastBackup(t){try{localStorage.setItem('kyr.lastBackup',String(t));}catch(e){}}
function ago(t){
  var d=Math.floor((Date.now()-t)/86400000);
  return d<=0?'today':d===1?'yesterday':d+' days ago';
}
function backupNeeded(){
  var own=state.tools.filter(function(t){var r=rigById(t.rigId);return r&&!r.fromShare;}).length;
  if(own<5) return false;
  var lb=getLastBackup(); return !lb||Date.now()-lb>21*86400000;
}
function exportBackup(){
  if(!state.rigs.length){toast('Nothing to back up yet.');return;}
  Promise.all(state.rigs.map(function(r){return serializeRig(r,true);})).then(function(rigs){
    var b={app:'knowyourrig',v:1,kind:'backup',made:Date.now(),set:getSetName()||undefined,rigs:rigs};
    var day=new Date().toISOString().slice(0,10);
    var file=new File([JSON.stringify(b)],'Know-Your-Rig-Backup-'+day+'.rigdeck',{type:'application/json'});
    return deliverFile(file,'Know Your Rig backup','Back up my rigs').then(function(done){
      if(done){setLastBackup(Date.now());toast('Backup ready. Keep it in iCloud Drive, Files or your email.');render();}
    });
  }).catch(function(e){console.error(e);toast('Could not make the backup.');});
}
function cleanSrs(x){
  var o=newSrs(); if(!x||typeof x!=='object') return o;
  var n=function(v,lo,hi){return typeof v==='number'&&isFinite(v)&&v>=lo&&v<=hi;};
  if(n(x.box,0,INTERVALS.length-1)) o.box=Math.floor(x.box);
  if(x.due===null||n(x.due,0,1e6)) o.due=x.due===null?null:Math.floor(x.due);
  if(n(x.seen,0,1e6)) o.seen=Math.floor(x.seen);
  if(n(x.lapses,0,1e6)) o.lapses=Math.floor(x.lapses);
  if(x.last===null||n(x.last,0,1e15)) o.last=x.last;
  if(['where','what','tap','recall'].indexOf(x.lastMode)>=0) o.lastMode=x.lastMode;
  return o;
}
function parseBackup(d){
  if(!Array.isArray(d.rigs)) throw new Error('That backup is damaged.');
  if(d.rigs.length>MAX_RIGS) throw new Error('That backup has too many rigs.');
  var seen=Object.create(null), rigs=[];
  d.rigs.forEach(function(r){
    var p; try{p=parseDeck(r,true);}catch(e){return;}   // skip a damaged rig, keep the rest
    if(p.id){if(seen[p.id]) return; seen[p.id]=1;}
    rigs.push(p);
  });
  if(!rigs.length) throw new Error('There are no rigs in that backup.');
  return {set:cleanSet(d.set),rigs:rigs};
}
function restoreBackup(b){
  var have=Object.create(null); state.rigs.forEach(function(r){if(r.deckId)have[r.deckId]=1;});
  var fresh=b.rigs.filter(function(p){return !(p.id&&have[p.id]);});
  var skipped=b.rigs.length-fresh.length;
  if(!fresh.length){toast('Everything in that backup is already here.');return;}
  var nc=0,nt=0; fresh.forEach(function(p){nc+=p.comps.length;p.comps.forEach(function(c){nt+=c.tools.length;});});
  var msg='Restore '+pl(fresh.length,'rig')+' ('+pl(nc,'compartment')+', '+pl(nt,'tool')+') from this backup?'+
    (skipped?' '+pl(skipped,'rig')+' you already have will be left as they are.':'')+' Your quiz progress comes back too.';
  confirmSheet(msg,'Restore',function(){doRestore(fresh,b.set);},'teal');
}
function doRestore(list,setName){
  var rigs=[],comps=[],tools=[],photos=[], now=Date.now();
  list.forEach(function(p,i){
    var name=p.name, base=name, n=1;
    while(state.rigs.concat(rigs).some(function(r){return lc(r.name)===lc(name);})){ n++; name=base.slice(0,MAX_NAME-16)+' (restored'+(n>2?' '+(n-1):'')+')'; }
    var rig={id:uid(),name:name,created:now+i};
    if(p.fromShare){rig.fromShare=true; if(p.set) rig.setName=p.set;}
    if(p.id){rig.deckId=p.id;rig.deckRev=p.rev;}
    rigs.push(rig);
    p.comps.forEach(function(pc){
      var comp={id:uid(),rigId:rig.id,name:pc.name,photoId:null,created:now+comps.length}; if(pc.sid) comp.sid=pc.sid;
      if(pc.blob){var pid=uid();photos.push({id:pid,blob:pc.blob});comp.photoId=pid;}
      comps.push(comp);
      pc.tools.forEach(function(pt){
        var t={id:uid(),rigId:rig.id,compId:comp.id,name:pt.name,x:pt.x,y:pt.y,srs:pt.srs||newSrs(),created:now+tools.length};
        if(pt.sid)t.sid=pt.sid; if(pt.note)t.note=pt.note; tools.push(t);});
    });
  });
  return Promise.all(photos.map(function(q){return Store.put('photos',q);}).concat(rigs.map(function(r){return save('rigs',r);}),comps.map(function(c){return save('comps',c);}),tools.map(function(t){return save('tools',t);})))
    .then(function(){
      photos.forEach(function(q){photoUrl.set(q.id,URL.createObjectURL(q.blob));});
      state.rigs.push.apply(state.rigs,rigs);state.comps.push.apply(state.comps,comps);state.tools.push.apply(state.tools,tools);
      if(setName&&!getSetName()) setSetName(setName);
      toast('Restored '+pl(rigs.length,'rig')+'.');
      state.edit=false; go('home');
    }).catch(function(e){console.error(e);toast('Restore failed part-way. Open the file again.');});
}

/* ---------- files opened from outside the app (Messages, Mail, Files, AirDrop) ---------- */
var lastIncoming={url:'',t:0};
function b64ToFile(b64){
  b64=String(b64).replace(/^data:[^,]*,/,'');
  var bin=atob(b64), bytes=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);

function readIncoming(url){

  var viaFs=(P&&P.Filesystem&&P.Filesystem.readFile)?Promise.resolve(P.Filesystem.readFile({path:url})):Promise.reject(new Error('no filesystem'));

    var d=r&&r.data;
    if(typeof d==='string'&&d) return b64ToFile(d);

    console.error('readFile failed, trying fetch',e1);

    return fetch(u).then(function(r){if(!r.ok)throw new Error('fetch '+r.status);return r.blob();}).then(function(b){return new File([b],'shared.rigdeck',{type:'application/json'});});
  });
}
function openIncoming(url){
  if(typeof url!=='string'||!/\.(rigdeck|json)$/i.test(url.split('?')[0].split('#')[0])) return;
  var now=Date.now(); if(lastIncoming.url===url&&now-lastIncoming.t<4000) return; // the same open can be delivered twice at launch

function setupIncoming(){

  try{A.addListener('appUrlOpen',function(e){openIncoming(e&&e.url);});}catch(e){console.error(e);}
  try{if(A.getLaunchUrl) Promise.resolve(A.getLaunchUrl()).then(function(r){if(r&&r.url)openIncoming(r.url);}).catch(function(){});}catch(e){console.error(e);}
}
function sidOf(x){return typeof x==='string'&&/^[A-Za-z0-9_-]{1,64}$/.test(x)?x:null;}
function parseDeck(d,allowEmpty){
  if(!d||d.app!=='knowyourrig'||d.v!==1||typeof d.name!=='string'||!Array.isArray(d.comps)||!Array.isArray(d.tools)) throw new Error('That is not a Know Your Rig file.');
  if(d.comps.length>MAX_COMPS||d.tools.length>MAX_COMPS*MAX_TOOLS) throw new Error('That rig is too large.');
  var comps=[], keyMap=Object.create(null), seenC=Object.create(null), seenT=Object.create(null);
  d.comps.forEach(function(c){
    if(!c||typeof c.name!=='string') return;
    var o={name:c.name.trim().slice(0,MAX_NAME)||'Compartment',blob:null,sid:sidOf(c.sid),tools:[]};
    if(o.sid){if(seenC[o.sid]) o.sid=null; else seenC[o.sid]=1;}
    if(typeof c.photo==='string'&&c.photo){
      if(c.photo.length>MAX_PHOTO_CHARS) throw new Error('A photo in that file is too large.');
      o.blob=dataUrlToBlob(c.photo);

    var ok=typeof t.x==='number'&&typeof t.y==='number'&&t.x>=0&&t.x<=1&&t.y>=0&&t.y<=1;
    var o={name:t.name.trim().slice(0,MAX_NAME)||'Tool',x:ok?t.x:null,y:ok?t.y:null,sid:sidOf(t.sid),note:(typeof t.note==='string'?t.note.trim().slice(0,MAX_NOTE):''),srs:t.srs?cleanSrs(t.srs):null};
    if(o.sid){if(seenT[o.sid]) o.sid=null; else seenT[o.sid]=1;}

function importDeck(file){

    var d; try{d=JSON.parse(txt);}catch(e){throw new Error('That is not a rig file.');}
    if(d&&d.app==='knowyourrig'&&d.kind==='backup') return restoreBackup(parseBackup(d));
    if(file.size>60*1024*1024) throw new Error('That file is too large.');
    var p=parseDeck(d);
    var same=p.id&&state.rigs.find(function(r){return r.deckId===p.id;});
    if(same){
      if((same.deckRev||0)>=p.rev){toast('“'+same.name+'” is already up to date.');go('rig',{rigId:same.id});return;}
      confirmSheet('A newer version of “'+same.name+'” is in this file. Update it? Your progress on tools that are still in the deck is kept.','Update rig',function(){applyUpdate(same,p);},'teal');
      return;
    }

  }).catch(function(e){console.error(e);toast(e&&e.message?e.message:'Import failed.');});

  while(state.rigs.some(function(r){return lc(r.name)===lc(name);})){ n++; name=base.slice(0,MAX_NAME-16)+' (imported'+(n>2?' '+(n-1):'')+')'; }
  var rig={id:uid(),name:name,created:Date.now()}, comps=[], tools=[], photos=[];
  rig.fromShare=true; if(p.set) rig.setName=p.set;

    if(pc.blob){var pid=uid();photos.push({id:pid,blob:pc.blob});comp.photoId=pid;}
    comps.push(comp);
    pc.tools.forEach(function(pt){var t={id:uid(),rigId:rig.id,compId:comp.id,name:pt.name,x:pt.x,y:pt.y,srs:newSrs(),created:Date.now()};if(pt.sid)t.sid=pt.sid;if(pt.note)t.note=pt.note;tools.push(t);});
  });
  return Promise.all(photos.map(function(q){return Store.put('photos',q);}).concat([save('rigs',rig)],comps.map(function(c){return save('comps',c);}),tools.map(function(t){return save('tools',t);})))
    .then(function(){
      photos.forEach(function(q){photoUrl.set(q.id,URL.createObjectURL(q.blob));});
      state.rigs.push(rig);state.comps.push.apply(state.comps,comps);state.tools.push.apply(state.tools,tools);
      toast('Imported '+rig.name+': '+pl(comps.length,'compartment')+', '+pl(tools.length,'tool')+'.');
      go('rig',{rigId:rig.id});
    });
}
/* Update an already-imported deck in place. Items are matched by their stable ids, so progress on
   surviving tools is kept. Items with no id (added locally) are left alone. */
function applyUpdate(rig,p){
  var cBy=Object.create(null), tBy=Object.create(null), inC=Object.create(null), inT=Object.create(null);
  state.comps.filter(function(c){return c.rigId===rig.id&&c.sid;}).forEach(function(c){cBy[c.sid]=c;});
  state.tools.filter(function(t){return t.rigId===rig.id&&t.sid;}).forEach(function(t){tBy[t.sid]=t;});
  var st={added:0,changed:0,removed:0}, newPhotos=[], oldPhotos=[], touchedC=[], touchedT=[];
  p.comps.forEach(function(pc){
    var comp=pc.sid&&cBy[pc.sid];
    if(!comp){comp={id:uid(),rigId:rig.id,name:pc.name,photoId:null,created:Date.now()}; if(pc.sid)comp.sid=pc.sid; state.comps.push(comp); st.added++;}
    else if(comp.name!==pc.name){comp.name=pc.name;st.changed++;}
    if(pc.sid) inC[pc.sid]=1;
    if(comp.photoId) oldPhotos.push(comp.photoId);
    if(pc.blob){var pid=uid();newPhotos.push({id:pid,blob:pc.blob});comp.photoId=pid;} else comp.photoId=null;
    touchedC.push(comp);
    pc.tools.forEach(function(pt){
      var t=pt.sid&&tBy[pt.sid];
      if(!t){t={id:uid(),rigId:rig.id,compId:comp.id,name:pt.name,x:pt.x,y:pt.y,srs:newSrs(),created:Date.now()}; if(pt.sid)t.sid=pt.sid; if(pt.note)t.note=pt.note; state.tools.push(t); st.added++;}
      else{
        if(t.name!==pt.name||t.x!==pt.x||t.y!==pt.y||t.compId!==comp.id||(pt.note&&pt.note!==t.note)) st.changed++;
        t.name=pt.name;t.x=pt.x;t.y=pt.y;t.compId=comp.id; if(pt.note) t.note=pt.note;   // an empty note in the deck never erases a local one
      }
      if(pt.sid) inT[pt.sid]=1;
      touchedT.push(t);
    });
  });
  var gone=state.tools.filter(function(t){return t.rigId===rig.id&&t.sid&&!inT[t.sid];});
  gone.forEach(function(t){drop('tools',t.id);}); st.removed+=gone.length;
  state.tools=state.tools.filter(function(t){return gone.indexOf(t)<0;});
  var goneC=state.comps.filter(function(c){return c.rigId===rig.id&&c.sid&&!inC[c.sid];});
  goneC.forEach(function(c){deleteComp(c);}); st.removed+=goneC.length;
  rig.deckRev=p.rev; if(p.set) rig.setName=p.set;
  Promise.all(newPhotos.map(function(q){return Store.put('photos',q);})).then(function(){
    newPhotos.forEach(function(q){photoUrl.set(q.id,URL.createObjectURL(q.blob));});
    oldPhotos.forEach(function(id){if(!state.comps.some(function(c){return c.photoId===id;})) forgetPhoto(id);});
    return Promise.all([save('rigs',rig)].concat(touchedC.map(function(c){return save('comps',c);}),touchedT.map(function(t){return save('tools',t);})));
  }).then(function(){
    toast('Updated '+rig.name+': '+st.added+' added, '+st.changed+' changed, '+st.removed+' removed.');
    if(state.view==='home') go('rig',{rigId:rig.id}); else {state.view='rig';state.rigId=rig.id;state.stack=[];render();}
  }).catch(function(e){console.error(e);toast('Update failed part-way. Import the file again.');});
}

/* ---------- render + boot ---------- */
function render(){
  var app=document.getElementById('app'); app.replaceChildren();
  var v={home:viewHome,rig:viewRig,comp:viewComp,quiz:viewQuiz,find:viewFind,found:viewFound}[state.view]||viewHome;
  try{ app.append.apply(app,v()); }
  catch(e){ console.error(e); app.append(h('div',{class:'warn'},'Something went wrong drawing this screen.'),h('button',{class:'btn block',onclick:function(){state.stack=[];state.view='home';state.quiz=null;state.placing=null;render();}},'Back to start')); }
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&(state.view==='home'||state.view==='rig'))render();});

Store.init().then(function(){return Promise.all([Store.all('rigs'),Store.all('comps'),Store.all('tools'),Store.all('photos')]);}).then(function(r){
  state.rigs=r[0].sort(function(a,b){return a.created-b.created;});
  state.comps=r[1].sort(function(a,b){return a.created-b.created;});
  state.tools=r[2].sort(function(a,b){return a.created-b.created;}).map(function(t){t.srs=Object.assign(newSrs(),t.srs||{});return t;});
  r[3].forEach(function(p){photoUrl.set(p.id,URL.createObjectURL(p.blob));});
}).catch(function(e){console.error(e);}).then(render).then(setupIncoming);

window.RT={state:state,go:go,grade:grade,buildSession:buildSession,dayNum:dayNum,modesFor:modesFor,judgeTap:judgeTap,INTERVALS:INTERVALS,
  newSrs:newSrs,parseDeck:parseDeck,parseBackup:parseBackup,cleanSrs:cleanSrs,isDue:isDue,isNew:isNew,_setClock:function(f){clock=f;},_persistent:function(){return persistent;}};
})();
</script>
